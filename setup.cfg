[metadata]
name = cc-analysis
version = 3.0.0
description = A GUI tool to extract and consolidate credit card and bank statements into Excel.
long_description = file: README.md
long_description_content_type = text/markdown
author = Senthil Kumar
author_email = senthilrom@gmail.com
license = MIT
license_files = LICENSE
url = https://github.com/senthilrom/cc-analysis
classifiers =
    Development Status :: 5 - Production/Stable
    Environment :: Console
    Intended Audience :: End Users/Desktop
    Topic :: Office/Business :: Financial
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.8
install_requires =
    pdfplumber>=0.10.2
    pandas>=1.3
    openpyxl>=3.0
    PyPDF2>=3.0
    tabulate>=0.9
    python-docx>=1.0.0

[options.package_data]
cc_analysis =
    help.txt
    about.txt
    README.md

[options.entry_points]
console_scripts =
    cc-analysis = cc_analysis.__main__:main

[tool:pytest]
addopts = -ra -q
markers =
    unit: marks unit tests (deselect with '-m "not unit"')