[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-analysis"
version = "3.0.0"
description = "A GUI tool to extract and consolidate credit card and bank statements into Excel."
readme = "README.md"
authors = [
  { name = "Senthil Kumar", email = "senthilrom@gmail.com" }
]
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
  "pdfplumber>=0.10.2",
  "pandas>=1.3",
  "openpyxl>=3.0",
  "PyPDF2>=3.0",
  "tabulate>=0.9",
  "python-docx>=1.0.0",
  "tkcalendar>=1.6.1",
]

[project.urls]
Homepage = "https://github.com/senthilrom/cc-analysis"

[project.scripts]
cc-analysis = "cc_analysis.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests", "docs"]

[tool.setuptools.package-data]
"cc_analysis" = ["help.txt", "about.txt", "README.md"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
markers = [
  "unit: mark as unit test"
]
